# omac: Ghostty behaves like Ghostty on macOS.
#
# With omac's keyboard layout, ⌘ reaches Ghostty as Ctrl and ⌃ as Super.
# So ctrl+… here is what macOS Ghostty does with ⌘+…, and super+… sends the
# control characters a Mac terminal sends for ⌃+….

# --- ⌘: Mac terminal actions -------------------------------------------------
keybind = ctrl+c=copy_to_clipboard
# Text pastes. With only an image on the clipboard there's nothing to paste, so
# Ctrl+V goes through to the app: Claude Code reads the image on Ctrl+V.
keybind = performable:ctrl+v=paste_from_clipboard
keybind = ctrl+a=select_all
keybind = ctrl+t=new_tab
keybind = ctrl+n=new_window
keybind = ctrl+w=close_surface
keybind = ctrl+shift+w=close_tab:this
keybind = ctrl+q=quit
keybind = ctrl+k=clear_screen
keybind = ctrl+f=start_search
keybind = ctrl+d=new_split:right
keybind = ctrl+shift+d=new_split:down
keybind = ctrl+bracket_left=goto_split:previous
keybind = ctrl+bracket_right=goto_split:next
keybind = ctrl+shift+bracket_left=previous_tab
keybind = ctrl+shift+bracket_right=next_tab
keybind = ctrl+one=goto_tab:1
keybind = ctrl+two=goto_tab:2
keybind = ctrl+three=goto_tab:3
keybind = ctrl+four=goto_tab:4
keybind = ctrl+five=goto_tab:5
keybind = ctrl+six=goto_tab:6
keybind = ctrl+seven=goto_tab:7
keybind = ctrl+eight=goto_tab:8
keybind = ctrl+nine=goto_tab:9
keybind = ctrl+equal=increase_font_size:1
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

# Caret keys, as macOS Ghostty: ⌘←/→ line start/end, ⌘⌫ delete line,
# ⌥←/→ word (Hyprland sends ⌥ arrows as Alt arrows).
keybind = ctrl+arrow_left=text:\x01
keybind = ctrl+arrow_right=text:\x05
keybind = ctrl+backspace=text:\x15
keybind = alt+arrow_left=esc:b
keybind = alt+arrow_right=esc:f

# Every other ⌘+letter does nothing, as in a Mac terminal, rather than leaking
# through as a control character.
keybind = ctrl+b=ignore
keybind = ctrl+e=ignore
keybind = ctrl+g=ignore
keybind = ctrl+h=ignore
keybind = ctrl+i=ignore
keybind = ctrl+j=ignore
keybind = ctrl+l=ignore
keybind = ctrl+m=ignore
keybind = ctrl+o=ignore
keybind = ctrl+p=ignore
keybind = ctrl+r=ignore
keybind = ctrl+s=ignore
keybind = ctrl+u=ignore
keybind = ctrl+x=ignore
keybind = ctrl+y=ignore
keybind = ctrl+z=ignore

# --- ⌃: control characters ---------------------------------------------------
keybind = super+a=text:\x01
keybind = super+b=text:\x02
keybind = super+c=text:\x03
keybind = super+d=text:\x04
keybind = super+e=text:\x05
keybind = super+f=text:\x06
keybind = super+g=text:\x07
keybind = super+h=text:\x08
keybind = super+i=text:\x09
keybind = super+j=text:\x0a
keybind = super+k=text:\x0b
keybind = super+l=text:\x0c
keybind = super+m=text:\x0d
keybind = super+n=text:\x0e
keybind = super+o=text:\x0f
keybind = super+p=text:\x10
keybind = super+q=text:\x11
keybind = super+r=text:\x12
keybind = super+s=text:\x13
keybind = super+t=text:\x14
keybind = super+u=text:\x15
keybind = super+v=text:\x16
keybind = super+w=text:\x17
keybind = super+x=text:\x18
keybind = super+y=text:\x19
keybind = super+z=text:\x1a
keybind = super+bracket_left=text:\x1b
keybind = super+backslash=text:\x1c
keybind = super+bracket_right=text:\x1d
